name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/DuoOpen-${{ steps.version.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/DuoOpen-${{ steps.version.outputs.name }}-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duo-open-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
